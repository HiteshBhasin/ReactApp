# Build the React client and deploy it to GitHub Pages
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portforlio-App/Client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portforlio-App/Client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        # CI=false so lint warnings don't fail the build
        run: CI=false npx react-scripts build
      - name: SPA fallback for direct links like /home
        run: cp build/index.html build/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portforlio-App/Client/build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
